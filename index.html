<style>
*{box-sizing:border-box;margin:0}
:root{--g:#b8891f;--g2:#e8c76a;--ink:#1f1a10;--bg:#fffdf7;--soft:#f8f0da}
html{scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
a{color:inherit}
.w{max-width:1100px;margin:auto;padding:0 18px}
nav{position:sticky;top:0;z-index:5;background:#fffdf7ee;backdrop-filter:blur(8px);border-bottom:1px solid #eadfbf}
nav .w{display:flex;align-items:center;gap:14px;height:62px}
nav img{width:40px;height:40px;border-radius:50%}
nav b{font-family:Georgia,serif;color:var(--g);letter-spacing:.5px;flex:1}
nav a.l{text-decoration:none;font-size:14px;display:none}
.btn{display:inline-block;padding:11px 20px;border-radius:30px;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;font-weight:600;text-decoration:none;border:0;font-size:15px;cursor:pointer;box-shadow:0 6px 16px #b8891f40}
.btn.o{background:#fff;color:var(--g);border:1.5px solid var(--g);box-shadow:none}
.hero{padding:34px 0 10px;background:radial-gradient(circle at 80% 20%,#f7e8bd,transparent 55%)}
.hero .w{display:grid;gap:10px;align-items:center}
h1{font-family:Georgia,serif;font-size:clamp(32px,7vw,54px);line-height:1.1}
h1 span{color:var(--g)}
.hero p{margin:14px 0 20px;color:#4a4130;max-width:520px}
.row{display:flex;gap:10px;flex-wrap:wrap}
#c{height:300px;width:100%}
.cr{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.cr i{font-style:normal;font-size:12px;padding:5px 11px;border-radius:20px;background:var(--soft);border:1px solid #e6d49c}
section{padding:46px 0}
h2{font-family:Georgia,serif;font-size:clamp(26px,5vw,36px);text-align:center}
h2:after{content:"";display:block;width:60px;height:3px;background:linear-gradient(90deg,var(--g),var(--g2));margin:10px auto 0}
.sub{text-align:center;color:#6b5f45;margin:12px 0 22px}
.ch{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px}
.ch button{white-space:nowrap;padding:8px 15px;border-radius:20px;border:1px solid #d9c583;background:#fff;color:var(--ink);font-size:14px;cursor:pointer}
.ch button.on{background:var(--g);color:#fff;border-color:var(--g)}
.gr{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.cd{background:#fff;border:1px solid #eadfbf;border-radius:16px;padding:16px;text-align:left;cursor:pointer;transition:.2s;font:inherit;color:inherit}
.cd:hover{transform:translateY(-4px);box-shadow:0 12px 26px #b8891f30;border-color:var(--g2)}
.cd em{font-style:normal;font-size:26px}
.cd h3{font-size:16px;margin:6px 0 4px}
.cd small{color:#7a6a40;display:block}
.cd span{display:block;margin-top:10px;color:var(--g);font-weight:600;font-size:14px}
dialog{border:0;border-radius:20px;max-width:560px;width:calc(100% - 24px);max-height:88vh;padding:0;color:var(--ink);background:#fff}
dialog::backdrop{background:#000a}
.mi{padding:24px 20px}
.x{position:absolute;right:12px;top:8px;border:0;background:none;font-size:30px;cursor:pointer;color:var(--g)}
dialog h3{font-family:Georgia,serif;font-size:23px;padding-right:30px}
dialog h4{color:var(--g);font-size:13px;text-transform:uppercase;letter-spacing:1px;margin:14px 0 3px}
.tag{color:#7a6a40;font-size:13px}
.box{background:var(--soft);border:1px solid #e6d49c;border-radius:12px;padding:4px 14px 12px;margin-top:14px}
.note{font-size:13px;color:#6b5f45;margin:14px 0}
.rc{background:#fff;border-radius:10px;padding:10px 12px;margin-top:8px;font-size:14px}
.rc b{color:var(--g);font-size:13px}
.ab{display:grid;gap:14px;max-width:760px;margin:auto}
.ct{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.ct a,.ct div{background:#fff;border:1px solid #eadfbf;border-radius:14px;padding:16px;text-decoration:none}
.ct b{color:var(--g);display:block;font-size:13px;text-transform:uppercase;letter-spacing:1px}
